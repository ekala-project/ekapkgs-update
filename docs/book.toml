[book]
title = "ekapkgs-update Documentation"
authors = ["ekapkgs-update Contributors"]
language = "en"
src = "src"
description = "Automated package updater for Nix package repositories"

[build]
build-dir = "book"
create-missing = true

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/ekapkgs/ekapkgs-update"
edit-url-template = "https://github.com/ekapkgs/ekapkgs-update/edit/master/docs/{path}"

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.fold]
enable = true
level = 0

[output.html.playground]
editable = false
copyable = true
line-numbers = false
