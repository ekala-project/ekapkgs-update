[package]
name = "ekapkgs-update"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
camino = "1.1"
chrono = "0.4"
clap = { version = "4.5.53", features = ["derive", "color"] }
directories = "5.0"
futures = "0.3"
num_cpus = "1.16"
openssl = { version = "0.10.75", features = ["vendored"] }
regex = "1.0"
reqwest = { version = "0.12", features = ["json"] }
rlimit = "0.11"
rnix = "0.12.0"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = "3.1"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.48.0", features = ["process", "io-util", "rt-multi-thread", "macros", "fs"] }
tokio-stream = "0.1"
thiserror = "1.0"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
walkdir = "2.5"

# See `refinements.md` §3.4 for rationale. Rules are pitched at "warn", not
# "deny", so they surface refactor opportunities without blocking workflows.
[lints.rust]
unsafe_code        = "forbid"
# `unreachable_pub` is intentionally not enabled: while this crate has a
# [lib] target (primarily for doctests), it is not a public library crate,
# so `pub` items are "unreachable" outside the crate boundary.
rust_2018_idioms   = { level = "warn", priority = -1 }

[lints.clippy]
# Baseline: keep the default clippy level group at "warn" (it already is),
# and selectively warn on pedantic lints that map to refinements.md §2.
all      = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery  = { level = "allow", priority = -1 }

# Pedantic lints we *do* want, drawn from refinements.md §2:
cloned_instead_of_copied = "warn"  # §2.5
redundant_closure_for_method_calls = "warn"  # §2.3
str_to_string            = "warn"  # §2.4 — high-volume; surfaces refactor targets
needless_pass_by_value   = "warn"  # §2.6
manual_let_else          = "warn"  # §2.1
match_same_arms          = "warn"  # §2.1
unnecessary_wraps        = "warn"  # §1.4
implicit_clone           = "warn"  # §2.5 (also covers former string_to_string)
inefficient_to_string    = "warn"  # §2.4

# Allow lints that fight existing patterns in this codebase:
too_many_arguments       = "allow"  # constructor-like fns deliberately fan out
module_name_repetitions  = "allow"  # idiomatic for re-exports

