name: Nix build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  ekapkgs:
    name: Nix build (ekapkgs, locked)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
      with:
        extra_nix_config: |
          extra-substituters = https://ekala-corepkgs.cachix.org
          extra-trusted-public-keys = ekala-corepkgs.cachix.org-1:DcZV+vegWoEzacbSdXFXU4S7728C0eS9RfGpKeyHd6w=
    - name: Build packages
      run: nix build --print-build-logs .#ekapkgs-update .#ekapkgs-update-web

  nixpkgs:
    # The NixOS module applies nix/overlay.nix to the host's nixpkgs, so make
    # sure the overlay also builds against upstream nixpkgs.
    name: Nix build (nixpkgs, nixos-unstable)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
    - name: Build packages
      run: nix build --print-build-logs --impure -f nix/nixpkgs-compat.nix
